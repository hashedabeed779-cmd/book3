<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قاموس مصوّر</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b1730">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
<button id="inst" hidden style="position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:100;padding:12px 22px;border:0;border-radius:999px;background:linear-gradient(#fcc22d,#f5a900);color:#2a1d00;font:700 15px system-ui,sans-serif;box-shadow:0 0 22px rgba(251,180,12,.6);cursor:pointer">📲 تثبيت التطبيق</button>
<script>
(function(){
  var b=document.getElementById("inst"),dp=null;
  window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();dp=e;b.hidden=false;});
  b.addEventListener("click",function(){
    if(dp){dp.prompt();dp.userChoice.then(function(){dp=null;b.hidden=true;});}
    else{alert("في Safari: اضغط زر المشاركة ثم «إضافة إلى الشاشة الرئيسية»");}
  });
  window.addEventListener("appinstalled",function(){b.hidden=true;});
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.navigator.standalone;
  if(ios){b.textContent="📲 كيف أثبّته؟";b.hidden=false;}
})();
</script>
<script src="app.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
</body>
</html>
